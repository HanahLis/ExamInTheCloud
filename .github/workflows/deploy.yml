name: CloudExam CI/CD Pipeline

on:
  push:
    branches:
      - main
      - manh_branch
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Yêu cầu để xác thực qua AWS OIDC STS (Zero Long-lived Keys)
  contents: read    # Quyền đọc mã nguồn kho lưu trữ

jobs:
  # ============================================================================
  # JOB 1: CHẠY BỘ KIỂM THỬ TỰ ĐỘNG MULTI-CLOUD, BIOMETRIC & RESILIENCY
  # ============================================================================
  test-suite:
    name: Backend Test Suite (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Multi-Cloud Integration Tests (Google Gemini, Upstash, Turnstile)
        run: python tests/multi_cloud_test.py

      - name: Run Biometric AI Face Verification Tests (Amazon Rekognition)
        run: python tests/test_face_verify.py

      - name: Run Edge Security & Resiliency Tests (AWS WAFv2 & SQS DLQ)
        run: python tests/waf_sqs_test.py

  # ============================================================================
  # JOB 2: BIÊN DỊCH VÀ ĐÓNG GÓI FRONTEND REACT SPA
  # ============================================================================
  frontend-build:
    name: Frontend SPA Build (Node.js 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend install

      - name: Build React SPA
        run: npm --prefix frontend run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================================
  # JOB 3: TRIỂN KHAI HẠ TẦNG VÀ SPA LÊN AWS QUA OIDC STS
  # ============================================================================
  aws-deploy:
    name: AWS Infrastructure & App Deployment (OIDC STS)
    needs: [test-suite, frontend-build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Configure AWS Credentials via OIDC STS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::409289618109:role/cloudexam-role-github-actions-deploy-dev' }}
          aws-region: ap-southeast-1
          audience: sts.amazonaws.com

      - name: Set up Python for Cloud Seeder
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Deploy Dependencies
        run: pip install boto3 botocore requests

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init & Validate
        run: |
          cd backend/terraform
          terraform init
          terraform validate

      - name: Terraform Plan
        run: |
          cd backend/terraform
          terraform plan -out=tfplan

      - name: Terraform Apply
        run: |
          cd backend/terraform
          terraform apply -auto-approve tfplan

      - name: Sync Frontend Artifacts to CloudFront S3 Bucket
        run: |
          aws s3 sync frontend/dist/ s3://cloudexam-frontend-dev/ --delete || true
          aws s3 sync frontend/dist/ s3://${{ secrets.S3_BUCKET_NAME || 'cloudexam-storage-409289618109-dev' }}/web/ --delete || true
          aws cloudfront create-invalidation --distribution-id E970UR5DL051S --paths "/*" || true

