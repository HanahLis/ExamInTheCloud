<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 1120" width="740" height="1120" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9333EA"/>
    </marker>
  </defs>

  <!-- 1. Node 1: Mở web -->
  <rect x="230" y="25" width="280" height="46" rx="10" fill="#EBF3FC" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="370" y="44" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">Giảng viên / Quản trị viên</text>
  <text x="370" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">mở ứng dụng Web</text>

  <line x1="370" y1="71" x2="370" y2="100" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 2. Node 2: Đăng nhập Cognito -->
  <rect x="230" y="102" width="280" height="46" rx="10" fill="#EBF3FC" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="370" y="121" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">Đăng nhập qua</text>
  <text x="370" y="137" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">Cognito Hosted UI (PKCE)</text>

  <line x1="370" y1="148" x2="370" y2="182" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 3. Diamond: Xác thực thành công? -->
  <polygon points="370,185 470,225 370,265 270,225" fill="#FEF3D6" stroke="#D97706" stroke-width="1.8"/>
  <text x="370" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">Xác thực</text>
  <text x="370" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">thành công?</text>

  <!-- Nhánh Không -->
  <path d="M 270 225 L 140 225 L 140 262" fill="none" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="180" y="217" font-size="12" font-weight="600" fill="#DC2626">Không</text>
  <rect x="50" y="265" width="180" height="46" rx="8" fill="#FDE8E8" stroke="#EF4444" stroke-width="1.8"/>
  <text x="140" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#991B1B">Thông báo lỗi</text>
  <text x="140" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#991B1B">xác thực tài khoản</text>

  <!-- Nhánh Có -->
  <line x1="370" y1="265" x2="370" y2="305" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="382" y="287" font-size="12" font-weight="600" fill="#16A34A">Có</text>

  <!-- Node 4: Tạo ngân hàng câu hỏi -->
  <rect x="230" y="307" width="280" height="46" rx="10" fill="#EBF3FC" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="370" y="326" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">Tạo Ngân hàng câu hỏi</text>
  <text x="370" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">(POST /question-banks)</text>

  <line x1="370" y1="353" x2="370" y2="388" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 5. Diamond: Hình thức nạp câu hỏi? -->
  <polygon points="370,390 495,435 370,480 245,435" fill="#FEF3D6" stroke="#D97706" stroke-width="1.8"/>
  <text x="370" y="431" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">Phương thức nạp</text>
  <text x="370" y="448" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">câu hỏi vào đề?</text>

  <!-- ==================== 3 NHÁNH NẠP CÂU HỎI ==================== -->
  
  <!-- NHÁNH 1 (BÊN TRÁI): AI Google Gemini -->
  <path d="M 245 435 L 125 435 L 125 510" fill="none" stroke="#9333EA" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <rect x="42" y="468" width="166" height="24" rx="4" fill="#F3E8FF" stroke="#A855F7" stroke-width="1"/>
  <text x="125" y="484" text-anchor="middle" font-size="11" font-weight="bold" fill="#6B21A8">Số hóa tự động qua AI</text>

  <rect x="30" y="512" width="190" height="46" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.8"/>
  <text x="125" y="531" text-anchor="middle" font-size="12" font-weight="600" fill="#5B21B6">Tải file Word (.docx)</text>
  <text x="125" y="547" text-anchor="middle" font-size="12" font-weight="600" fill="#5B21B6">hoặc PDF đề thi có sẵn</text>

  <line x1="125" y1="558" x2="125" y2="588" stroke="#9333EA" stroke-width="1.8" marker-end="url(#arrow-purple)"/>

  <rect x="25" y="590" width="200" height="58" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.8"/>
  <text x="125" y="609" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5B21B6">Lambda gọi Gemini Flash</text>
  <text x="125" y="625" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5B21B6">bóc tách câu hỏi, 4 đáp án</text>
  <text x="125" y="640" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5B21B6">&amp; phân cấp độ khó</text>


  <!-- NHÁNH 2 (Ở GIỮA): S3 Upload có ảnh -->
  <line x1="370" y1="480" x2="370" y2="510" stroke="#EA580C" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="295" y="485" width="150" height="20" rx="4" fill="#FFEDD5" stroke="#FB923C" stroke-width="1"/>
  <text x="370" y="499" text-anchor="middle" font-size="11" font-weight="bold" fill="#9A3412">Có ảnh minh họa</text>

  <rect x="265" y="512" width="210" height="46" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
  <text x="370" y="531" text-anchor="middle" font-size="12" font-weight="600" fill="#9A3412">Xin Presigned URL từ Lambda</text>
  <text x="370" y="547" text-anchor="middle" font-size="12" font-weight="600" fill="#9A3412">(POST /questions/image-upload)</text>

  <line x1="370" y1="558" x2="370" y2="588" stroke="#EA580C" stroke-width="1.8" marker-end="url(#arrow-orange)"/>

  <rect x="265" y="590" width="210" height="58" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
  <text x="370" y="612" text-anchor="middle" font-size="12" font-weight="600" fill="#9A3412">Client tải ảnh trực tiếp</text>
  <text x="370" y="630" text-anchor="middle" font-size="12" font-weight="600" fill="#9A3412">lên S3 Bucket (questions/*)</text>


  <!-- NHÁNH 3 (BÊN PHẢI): Câu hỏi chữ không ảnh -->
  <path d="M 495 435 L 610 435 L 610 700" fill="none" stroke="#4B5563" stroke-width="1.8"/>
  <rect x="525" y="468" width="170" height="24" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
  <text x="610" y="484" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Câu hỏi chữ (Không ảnh)</text>


  <!-- HỘI TỤ VÀO HÌNH STORAGE (CYLINDER) -->
  <!-- Nối từ nhánh 1 (Trái) sang Storage -->
  <path d="M 125 648 L 125 725 L 235 725" fill="none" stroke="#9333EA" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  
  <!-- Nối từ nhánh 2 (Giữa) sang Storage -->
  <line x1="370" y1="648" x2="370" y2="695" stroke="#EA580C" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="315" y="662" width="110" height="20" rx="4" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
  <text x="370" y="676" text-anchor="middle" font-size="11" font-weight="600" fill="#C2410C">Gán S3 imageKey</text>

  <!-- Nối từ nhánh 3 (Phải) sang Storage -->
  <path d="M 610 700 L 610 725 L 505 725" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>


  <!-- ==================== HÌNH STORAGE (DATABASE CYLINDER) ==================== -->
  <g transform="translate(200, 695)">
    <!-- Thân Cylinder -->
    <path d="M 0 16 
             L 0 54 
             A 170 16 0 0 0 340 54 
             L 340 16 
             Z" 
          fill="#FAF5FF" stroke="#9333EA" stroke-width="2"/>
    <!-- Đáy Cylinder -->
    <ellipse cx="170" cy="54" rx="170" ry="16" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
    <!-- Đỉnh Cylinder -->
    <ellipse cx="170" cy="16" rx="170" ry="16" fill="#E9D5FF" stroke="#9333EA" stroke-width="2"/>

    <!-- Chữ trong Storage Cylinder -->
    <text x="170" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#581C87">Lưu trữ dữ liệu câu hỏi</text>
    <text x="170" y="58" text-anchor="middle" font-size="11.5" font-weight="500" fill="#6B21A8">Lưu câu hỏi và đáp án chuẩn vào CloudExam_Questions_dev</text>
  </g>

  <!-- Mũi tên từ Storage xuống Ca thi -->
  <line x1="370" y1="768" x2="370" y2="805" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 6. Tạo ca thi -->
  <rect x="180" y="807" width="380" height="50" rx="10" fill="#FAF5FF" stroke="#9333EA" stroke-width="1.8"/>
  <text x="370" y="827" text-anchor="middle" font-size="13" font-weight="600" fill="#581C87">Tạo Ca thi và Gán danh sách thí sinh</text>
  <text x="370" y="845" text-anchor="middle" font-size="13" font-weight="600" fill="#581C87">vào CloudExam_Sessions_dev</text>

  <!-- Mũi tên từ Ca thi xuống Step Functions -->
  <line x1="370" y1="857" x2="370" y2="892" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 7. Step Functions & Link -->
  <rect x="160" y="894" width="420" height="52" rx="10" fill="#EBF3FC" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="370" y="915" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E3A8A">Đăng ký lịch kích hoạt tự động với AWS Step Functions</text>
  <text x="370" y="933" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E3A8A">&amp; Sinh đường dẫn phòng thi trực tiếp (/?exam=sessionId)</text>

  <!-- Mũi tên từ Step Functions xuống Hoàn tất -->
  <line x1="370" y1="946" x2="370" y2="982" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- 8. Success End (Pill xanh lá) -->
  <rect x="180" y="984" width="380" height="50" rx="25" fill="#DEF7EC" stroke="#10B981" stroke-width="2"/>
  <text x="370" y="1005" text-anchor="middle" font-size="13" font-weight="bold" fill="#065F46">Ca thi sẵn sàng trên hệ thống</text>
  <text x="370" y="1022" text-anchor="middle" font-size="12.5" font-weight="600" fill="#047857">Thí sinh đủ điều kiện có thể điểm danh</text>
</svg>